version: 2
updates:
  # Maven dependencies (pom.xml) — surfaces library + framework updates,
  # including the security fixes Trivy gates on (see ADR-0004).
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies

  # GitHub Actions used in .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
