name: CI

# Build + test gate on dev. No deploy (see ADR-0004). Integration tests (*IT)
# run against a real PostgreSQL service container, mirroring ADR-0003's
# externally-managed-Postgres contract.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oauth_template_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d oauth_template_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The `test` Spring profile reads these placeholders from
      # src/test/resources/application-test.yaml (no source change needed).
      TEST_DB_URL: jdbc:postgresql://localhost:5432/oauth_template_test
      TEST_DB_USERNAME: test
      TEST_DB_PASSWORD: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          # Cache ~/.m2 keyed on pom.xml so warm runs skip dependency downloads.
          cache: maven

      - name: Build & test (verify)
        # Surefire (*Test) + Failsafe (*IT) both run in the verify phase.
        run: ./mvnw -B verify

      # Dependency-vulnerability gate. Scans the resolved Maven dependencies and
      # fails the build on HIGH/CRITICAL findings. Documented exceptions live in
      # .trivyignore (with justification), per ADR-0004 — never silently disabled.
      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore
