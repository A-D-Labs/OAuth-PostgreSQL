version: '3.8'

services:
  app:
    # Image is built daemonlessly by Jib: `./mvnw -DskipTests package jib:dockerBuild`
    image: oauth-postgresql:${OAUTH_IMAGE_TAG:-latest}
    container_name: oauth-app-${SPRING_PROFILES_ACTIVE:-dev}
    env_file:
      - ../../.env.${SPRING_PROFILES_ACTIVE:-dev}
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - oauth-uploads-${SPRING_PROFILES_ACTIVE:-dev}:/app/data/uploads
      - oauth-logs-${SPRING_PROFILES_ACTIVE:-dev}:/var/log/oauth-app
    networks:
      - oauth-network-${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/management/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: postgres:16-alpine
    container_name: oauth-db-${SPRING_PROFILES_ACTIVE:-dev}
    restart: unless-stopped
    env_file:
      - ../../.env.${SPRING_PROFILES_ACTIVE:-dev}
    environment:
      - POSTGRES_DB=oauth_${SPRING_PROFILES_ACTIVE:-dev}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - oauth-pg-data-${SPRING_PROFILES_ACTIVE:-dev}:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - oauth-network-${SPRING_PROFILES_ACTIVE:-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d oauth_${SPRING_PROFILES_ACTIVE:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: oauth-redis-${SPRING_PROFILES_ACTIVE:-dev}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - oauth-network-${SPRING_PROFILES_ACTIVE:-dev}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  oauth-network-${SPRING_PROFILES_ACTIVE:-dev}:
    driver: bridge

volumes:
  oauth-uploads-${SPRING_PROFILES_ACTIVE:-dev}:
  oauth-logs-${SPRING_PROFILES_ACTIVE:-dev}:
  oauth-pg-data-${SPRING_PROFILES_ACTIVE:-dev}: