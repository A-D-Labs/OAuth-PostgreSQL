version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: .docker/test/Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - TEST_DB_URL=jdbc:postgresql://db:5432/oauth_template_test
      - TEST_DB_USERNAME=test
      - TEST_DB_PASSWORD=test
    volumes:
      - ./src:/app/src
      - ./target:/app/target
    depends_on:
      db:
        condition: service_healthy
    networks:
      - test-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=oauth_template_test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d oauth_template_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

networks:
  test-network:
    driver: bridge