version: '3.8'

# Provisions the PostgreSQL the test suite runs against (see
# docs/adr/0003-testcontainers-postgres-for-tests.md). Tests are NOT run inside a
# container — they execute via `./mvnw verify` on the host and connect to this DB on
# localhost:5433. Bring it up first:
#   docker-compose -f docker/compose/docker-compose.test.yml up -d
#   ./mvnw verify
services:
  db:
    image: postgres:16-alpine
    container_name: oauth-pg-test
    environment:
      - POSTGRES_DB=oauth_template_test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d oauth_template_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
