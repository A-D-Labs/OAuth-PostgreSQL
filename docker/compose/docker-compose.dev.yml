version: '3.8'

services:
  app:
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -Dspring.profiles.active=dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  db:
    ports:
      - "5432:5432"  # Expose PostgreSQL port for development