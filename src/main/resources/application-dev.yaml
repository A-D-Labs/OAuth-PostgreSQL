# Development Environment Configuration
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oauth_template}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ---- Mailtrap SMTP for dev ----
  mail:
    host: ${EMAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: ${EMAIL_DEBUG:false}

# App settings (dev)
app:
  # URLs & metadata used by EmailService and frontend redirects
  application:
    baseUrl: ${APP_BASE_URL:http://localhost:3000}
    verifyBaseUrl: ${VERIFY_BASE_URL:http://localhost:8080}
    supportEmail: ${SUPPORT_EMAIL:support@yourdomain.com}
    name: ${APP_NAME:OAuth Template}

  # Email presentation (From header)
  email:
    fromAddress: ${EMAIL_FROM_ADDRESS:no-reply@yourdomain.com}
    fromName: ${EMAIL_FROM_NAME:OAuth Template App}

  # Cookies & security (dev)
  security:
    # DEV ONLY: a strong-enough local default so the app boots without env setup. This is
    # public/insecure by definition — never reuse it outside local development. Real
    # environments must set JWT_SECRET (prod has no default and fails fast without it).
    jwt:
      secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-key-CHANGE-ME-0123456789}
    trust-proxy: false           # local dev is not behind a trusted reverse proxy
    cookie:
      secure: false
      sameSite: Lax
      # domain:                # leave empty for localhost

  # File uploads (dev)
  profile:
    upload-dir: ${UPLOAD_DIR:uploads/profiles/dev}

  # CORS
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}
      - http://localhost:5173

  # (Optional) legacy fields some code may reference.
  # Dev default points the post-login redirect back at the backend's own test harness
  # (DevTestLoginController, /dev/test-login on :8080) so a real Google/Microsoft sign-in lands
  # somewhere you can eyeball it, instead of a non-existent frontend on :3000. Override either
  # with FRONTEND_URL / LOGIN_SUCCESS_REDIRECT_URL when running against a real frontend.
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  login-success-redirect-url: ${LOGIN_SUCCESS_REDIRECT_URL:/dev/test-login}
  mail:
    enabled: true

# Logging (verbose in dev)
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.template.OAuth: DEBUG
    org.hibernate.SQL: DEBUG
    com.template.OAuth.service.AuditService: DEBUG

# Dev-time template/resource caching
spring.thymeleaf.cache: false
spring.resources.cache.period: 0
