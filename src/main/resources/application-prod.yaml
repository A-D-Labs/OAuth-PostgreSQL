# Production Environment Configuration
spring:
  datasource:
    url: jdbc:postgresql://prod-db-server:5432/OAuthTemplate_Prod?sslmode=require
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate  # Validate the schema, don't change the database
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Production environment settings
app:
  security:
    cookie:
      secure: true            # required when SameSite=None
      sameSite: None          # cross-site cookie (frontend on different domain)
      domain: ".yourdomain.com"  # share cookies across subdomains
      # partitioned: false     # only if you explicitly need CHIPS
    jwt:
      expiration: 1800000     # 30 minutes
    refresh:
      expiration: 2592000000  # 30 days
  profile:
    upload-dir: /app/data/uploads/profiles
  cors:
    allowed-origins:
      - https://www.yourdomain.com
      - https://admin.yourdomain.com

# Logging configuration for production (minimal)
logging:
  level:
    root: WARN
    com.template.OAuth: INFO
    com.template.OAuth.service.AuditService: DEBUG
  file:
    name: /var/log/oauth-app/application.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# SSL configuration for production
server:
  ssl:
    enabled: true
    key-store: classpath:prod-keystore.p12
    key-store-password: ${PROD_SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: tomcat
  http2:
    enabled: true
